<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafePII Mission Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Chivo+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/frontend/styles.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">SafePII-RL</p>
      <h1>Mission Console</h1>
      <p class="subtitle">Inspect tasks, execute actions, and grade outcomes directly against the running environment.</p>
    </header>

    <section class="panel controls">
      <div class="control-row">
        <label for="taskSelect">Task</label>
        <select id="taskSelect"></select>
      </div>
      <div class="btn-row">
        <button id="resetBtn" class="primary">Reset</button>
        <button id="stateBtn">Refresh State</button>
        <button id="gradeBtn">Grade</button>
        <button id="baselineBtn">Run Baseline</button>
      </div>
    </section>

    <section class="panel action-panel">
      <h2>Step Action</h2>
      <div class="btn-row action-types">
        <button data-action="detect" class="action-btn">Detect</button>
        <button data-action="classify" class="action-btn">Classify</button>
        <button data-action="redact" class="action-btn">Redact</button>
        <button data-action="finalize" class="action-btn">Finalize</button>
      </div>
      <div class="form-grid">
        <label>
          Confidence
          <input id="confidenceInput" type="number" min="0" max="1" step="0.05" value="0.8" />
        </label>
        <label>
          Classification
          <select id="classificationInput">
            <option value="">(none)</option>
            <option value="low">low</option>
            <option value="medium">medium</option>
            <option value="high">high</option>
          </select>
        </label>
      </div>
      <label>
        Redacted Text
        <textarea id="redactedTextInput" rows="3"></textarea>
      </label>
    </section>

    <section class="grid two-col">
      <article class="panel">
        <h2>Observation</h2>
        <pre id="observationView" class="code-view">{}</pre>
      </article>
      <article class="panel">
        <h2>Task Catalog</h2>
        <pre id="tasksView" class="code-view">[]</pre>
      </article>
    </section>

    <section class="grid two-col">
      <article class="panel">
        <h2>Latest Grade</h2>
        <pre id="gradeView" class="code-view">{"score": null}</pre>
      </article>
      <article class="panel">
        <h2>Baseline Scores</h2>
        <pre id="baselineView" class="code-view">{"scores": {}}</pre>
      </article>
    </section>

    <section class="panel">
      <h2>Event Log</h2>
      <div id="logView" class="log-view" aria-live="polite"></div>
    </section>
  </main>

  <script src="/frontend/app.js" defer></script>
</body>
</html>
